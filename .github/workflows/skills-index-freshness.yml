name: Skills Index Freshness Check (fork canary)

# FORK-ONLY re-derivation of the upstream watchdog.
# Base: NousResearch/hermes-agent @ origin/main .github/workflows/skills-index-freshness.yml
# Re-derived 2026-10-15 (origin/main 0e427d78). The fork's previous copy
# (fork/main 3a270499) was 77 lines behind and had no check-catalog-cors job.
#
# Why the fork keeps this half of the pair: this install consumes
#   https://hermes-agent.nousresearch.com/docs/api/skills-index.json
# through tools/skills_hub_search.py:26 (HERMES_INDEX_URL). Upstream files its
# alerts in its own repo (NousResearch/hermes-agent), which this install does not
# monitor, and the fork's copy never ran at all (upstream job guard, false on a
# fork -> every run concluded "skipped", zero jobs, zero runner minutes).
# This file watches the same URL and files its issue HERE -- the same intent
# ("so we hear about it before users do"), addressed to this fork's owner.
#
# Deliberate deviations from upstream (the fork-scoping edits):
#   1. job-level guards re-scoped NousResearch/hermes-agent -> He1i05/hermes-agent
#   2. get-app-token steps DROPPED (the fork holds no App credentials; this probe
#      is a public curl + issues: write and needs none), and the checkout step
#      dropped from check-freshness with them (it existed only so the local
#      composite action ./.github/actions/get-app-token could be resolved)
#   3. floors aligned with scripts/build_skills_index.py EXPECTED_FLOORS --
#      upstream shipped skills.sh:100 / clawhub:50 under a comment claiming
#      parity with the producer, whose real floors are 10000 / 20000, so the
#      upstream watchdog cannot see the collapse class it exists for
#   4. environment: trusted-automation dropped -- no protected secret is consumed
#      here, and a protected environment would stall an unattended scheduled canary
#
# Triggered every 4 hours so we catch a stuck cron within one tick.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-freshness:
    if: github.repository == 'He1i05/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe live index
        id: probe
        run: |
          set -e
          URL="https://hermes-agent.nousresearch.com/docs/api/skills-index.json"
          echo "Probing $URL"
          # -L follows redirects; -f fails on HTTP errors; -s suppresses progress
          if ! curl -fsSL --retry 3 --retry-delay 10 -o /tmp/skills-index.json "$URL"; then
            echo "status=fetch-failed" >> "$GITHUB_OUTPUT"
            echo "detail=Could not download $URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Validate + extract generated_at and per-source counts
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          from datetime import datetime, timezone

          try:
              with open("/tmp/skills-index.json") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"status=parse-failed")
              print(f"detail=JSON decode error: {e}")
              sys.exit(0)

          generated_at = data.get("generated_at", "")
          total = data.get("skill_count", 0)
          skills = data.get("skills", [])
          if not isinstance(skills, list):
              print("status=invalid-shape")
              print(f"detail=skills field is not a list (got {type(skills).__name__})")
              sys.exit(0)

          # Per-source counts
          from collections import Counter
          by_src = Counter(s.get("source", "") for s in skills)

          # Freshness
          age_hours = None
          try:
              ts = datetime.fromisoformat(generated_at.replace("Z", "+00:00"))
              age_hours = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
          except Exception:
              pass

          # Floors -- same as build_skills_index.py EXPECTED_FLOORS (fork edit #3).
          # Upstream shipped 100/100/50/50/30/50 under a comment claiming parity;
          # the producer's real floors are 10000/100/20000/50/30/50.
          floors = {
              "skills.sh": 10000,
              "lobehub": 100,
              "clawhub": 20000,
              "official": 50,
              "github": 30,
              "browse-sh": 50,
          }
          issues = []
          if age_hours is not None and age_hours > 26:
              issues.append(f"Index is {age_hours:.1f}h old (limit 26h)")
          for src, floor in floors.items():
              count = by_src.get(src, 0)
              if src == "skills.sh":
                  count = by_src.get("skills.sh", 0) + by_src.get("skills-sh", 0)
              if count < floor:
                  issues.append(f"{src}: {count} < {floor}")
          if total < 1500:
              issues.append(f"total skills: {total} < 1500")

          if issues:
              detail = "; ".join(issues)
              print("status=degraded")
              print(f"detail={detail}")
          else:
              print("status=ok")
              print(f"detail=Index OK -- {total} skills, generated {generated_at}")
              by_summary = ", ".join(f"{k}={v}" for k, v in by_src.most_common(8))
              print(f"summary={by_summary}")
          PY

      - name: Report status
        run: |
          echo "Probe status: ${{ steps.probe.outputs.status }}"
          echo "Detail:       ${{ steps.probe.outputs.detail }}"
          if [ -n "${{ steps.probe.outputs.summary }}" ]; then
            echo "Summary:      ${{ steps.probe.outputs.summary }}"
          fi

      - name: Open issue on degraded / failed probe
        if: steps.probe.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.probe.outputs.status }}
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: |
          # set -e is deliberate: if the fork's default GITHUB_TOKEN cannot be
          # granted issues:write, the gh call below fails and the JOB GOES RED.
          # The red scheduled run IS the fallback alert (never a silent green).
          set -e
          TITLE_PREFIX="[skills-index-watchdog]"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "in:title \"$TITLE_PREFIX\"" \
            --json number,title \
            --jq '.[] | select(.title | startswith("'"$TITLE_PREFIX"'")) | .number' \
            | head -1)
          BODY="Automated freshness probe failed.

          **Status:** \`$STATUS\`
          **Detail:** $DETAIL

          This install consumes \`/docs/api/skills-index.json\` through
          \`tools/skills_hub_search.py\` (HERMES_INDEX_URL). The unified index is
          produced and published upstream; upstream's own watchdog lives at
          https://github.com/NousResearch/hermes-agent/actions/workflows/skills-index-freshness.yml

          This issue was opened by the fork's canary
          \`.github/workflows/skills-index-freshness.yml\` (job \`check-freshness\`).
          Close it once the index is fresh again; the next probe reopens it if not."
          if [ -n "$existing" ]; then
            echo "Appending to existing issue #$existing"
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Probe still failing at $(date -u +%FT%TZ): \`$STATUS\` -- $DETAIL"
          else
            echo "Opening new watchdog issue"
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE_PREFIX Skills index is stale or degraded ($STATUS)" \
              --body "$BODY"
          fi

  check-catalog-cors:
    # Desktop's hermes://plugin/install?catalog= links fetch /docs/api/plugins.json
    # cross-origin. A browser rejects that fetch when any response in the redirect
    # chain lacks Access-Control-Allow-Origin (#136483). The probe above uses
    # curl -L, which never checks CORS, so it stays green while Desktop is blocked.
    if: github.repository == 'He1i05/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checkout is REQUIRED here: the probe is a repo script
      # (scripts/ci/check_catalog_cors.py, vendored fork-only in the same commit).
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Fetch the plugin catalog the way Desktop does
        id: probe
        run: |
          set +e
          detail=$(python3 scripts/ci/check_catalog_cors.py)
          code=$?
          echo "$detail"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "status=ok" >> "$GITHUB_OUTPUT" ;;
            1) echo "status=blocked" >> "$GITHUB_OUTPUT" ;;
            *) echo "status=unreachable" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Open issue when Desktop cannot read the catalog
        if: steps.probe.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.probe.outputs.status }}
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: |
          set -e
          TITLE_PREFIX="[plugin-catalog-cors-watchdog]"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "in:title \"$TITLE_PREFIX\"" \
            --json number,title \
            --jq '.[] | select(.title | startswith("'"$TITLE_PREFIX"'")) | .number' \
            | head -1)
          BODY="Hermes Desktop cannot read the plugin catalog.

          **Status:** \`$STATUS\`
          **Detail:** $DETAIL

          Desktop's \`hermes://plugin/install?catalog=\` links fetch \`/docs/api/plugins.json\`
          cross-origin. A browser rejects that fetch when any response in the redirect
          chain lacks \`Access-Control-Allow-Origin\`. Background: #136483.

          This issue was opened by the fork's canary
          \`.github/workflows/skills-index-freshness.yml\` (job \`check-catalog-cors\`).
          Close it once the header is back; the next probe reopens it if not."
          if [ -n "$existing" ]; then
            echo "Appending to existing issue #$existing"
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Probe still failing at $(date -u +%FT%TZ): \`$STATUS\` -- $DETAIL"
          else
            echo "Opening new watchdog issue"
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE_PREFIX Desktop cannot read the plugin catalog ($STATUS)" \
              --body "$BODY"
          fi
