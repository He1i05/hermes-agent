name: Verify Skills Index (fork consume-only)

# FORK-ONLY re-derivation of upstream .github/workflows/skills-index.yml.
# Base: NousResearch/hermes-agent @ origin/main (re-derived 2026-10-15).
#
# Upstream's file BUILDS the index: an App-token crawl of six sources, artifact
# upload, then a deploy-site.yml re-trigger. A fork cannot do that, and must not:
#   * .github/actions/get-app-token degrades to GITHUB_TOKEN (1,000 req/h) when
#     no App credentials exist, which is the fork's case;
#   * the rate-limited crawl lands under scripts/build_skills_index.py
#     EXPECTED_FLOORS, and that script exits 2 WITHOUT writing the output
#     (scripts/build_skills_index.py:466) -> a failed run and no artifact, which
#     is strictly worse than today's silent skip;
#   * the publish half (deploy-site.yml) is itself upstream-guarded
#     (.github/workflows/deploy-site.yml:53), so nothing fork-local would publish;
#   * nothing on the fork consumes a fork-built index -- the real consumers are the
#     local CLI (tools/skills_hub_search.py:26) and the docs site, both reading the
#     upstream URL.
# So the fork keeps the SCHEDULE and drops the WORK: this job asserts that the
# index this install consumes is fresh, complete, and above the producer's floors.
# Green run = the dependency is healthy. Red run = the alert (no issue needed).

on:
  schedule:
    # Same cadence as upstream's build (twice daily: 6 AM and 6 PM UTC).
    - cron: "0 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Self-test: the first push of this file onto fork main produces an
      # immediate green/red run, which is the fastest proof the fix works.
      - ".github/workflows/skills-index.yml"

permissions:
  contents: read

jobs:
  verify-index:
    if: github.repository == 'He1i05/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the live index and assert age / total / per-source floors
        run: |
          set -euo pipefail
          URL="https://hermes-agent.nousresearch.com/docs/api/skills-index.json"
          echo "Verifying $URL"
          curl -fsSL --retry 3 --retry-delay 10 -o /tmp/skills-index.json "$URL"
          ls -l /tmp/skills-index.json
          python3 <<'PY'
          import json
          import sys
          from collections import Counter
          from datetime import datetime, timezone

          MAX_AGE_HOURS = 26
          MIN_TOTAL = 1500
          # Same values as scripts/build_skills_index.py EXPECTED_FLOORS (upstream).
          FLOORS = {
              "skills.sh": 10000,
              "lobehub": 100,
              "clawhub": 20000,
              "official": 50,
              "github": 30,
              "browse-sh": 50,
          }

          try:
              with open("/tmp/skills-index.json") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"FAIL: cannot parse the downloaded index: {e}")
              sys.exit(1)

          generated_at = data.get("generated_at", "")
          total = data.get("skill_count", 0)
          skills = data.get("skills", [])
          if not isinstance(skills, list):
              print(f"FAIL: 'skills' is {type(skills).__name__}, not a list")
              sys.exit(1)

          by_src = Counter(s.get("source", "") for s in skills)

          age_hours = None
          try:
              ts = datetime.fromisoformat(str(generated_at).replace("Z", "+00:00"))
              age_hours = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
          except Exception as e:
              print(f"WARN: unparseable generated_at {generated_at!r}: {e}")

          print(f"generated_at : {generated_at}")
          print(f"age_hours    : {'unknown' if age_hours is None else f'{age_hours:.2f}'} (limit {MAX_AGE_HOURS})")
          print(f"skill_count  : {total} (floor {MIN_TOTAL})")
          for src, floor in FLOORS.items():
              print(f"  {src:<10}: {by_src.get(src, 0):>6} (floor {floor})")

          problems = []
          if age_hours is not None and age_hours > MAX_AGE_HOURS:
              problems.append(f"stale: {age_hours:.1f}h > {MAX_AGE_HOURS}h")
          if total < MIN_TOTAL:
              problems.append(f"total: {total} < {MIN_TOTAL}")
          for src, floor in FLOORS.items():
              count = by_src.get(src, 0)
              if src == "skills.sh":
                  count = by_src.get("skills.sh", 0) + by_src.get("skills-sh", 0)
              if count < floor:
                  problems.append(f"{src}: {count} < {floor}")

          if problems:
              print("RED: index is degraded -- " + "; ".join(problems))
              sys.exit(1)
          print("GREEN: index is fresh and above every producer floor.")
          PY
